<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Три дверцы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: one column "playroom" card; each language owns a colour + hero so the brain switches alphabet by context */
:root{
  --paper:#EDF0F6; --card:#FFFFFF; --ink:#1C2333; --muted:#5D6678; --line:#D5DAE6;
  --en:#2D5BD8; --en-soft:#E3EAFC;
  --ru:#D9472A; --ru-soft:#FBE6E0;
  --ua:#E0A400; --ua-soft:#FFF3CC; --ua-ink:#7A5700;
  --ok:#1E9A5A; --bad:#C8364B;
  --f-word:"Andika","Trebuchet MS",system-ui,sans-serif;
  --f-ui:"Rubik","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.app .app{width:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
h1,h2{margin:0;text-wrap:balance}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.doors{display:flex;gap:4px}
.doors i{display:block;width:14px;height:22px;border-radius:7px 7px 2px 2px}
.brand h1{font-size:1.45rem;font-weight:800;letter-spacing:-.01em}
.stars{font-weight:700;background:var(--card);border-radius:999px;padding:6px 14px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.panel{background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);font-weight:700}
.chip[aria-pressed="true"].en{border-color:var(--en);background:var(--en-soft)}
.chip[aria-pressed="true"].ru{border-color:var(--ru);background:var(--ru-soft)}
.chip[aria-pressed="true"].ua{border-color:var(--ua);background:var(--ua-soft)}
.chip[aria-pressed="true"].plain{border-color:var(--ink);background:var(--paper)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{background:var(--card);border-radius:20px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;
  border:2px solid transparent;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-2px);border-color:var(--ink)}
.mode .ico{font-family:var(--f-word);font-size:1.9rem;font-weight:700;height:44px;display:flex;align-items:center;gap:2px}
.mode .ico b:nth-child(1){color:var(--en)} .mode .ico b:nth-child(2){color:var(--ru)} .mode .ico b:nth-child(3){color:var(--ua)}
.mode h2{font-size:1.1rem}
.mode p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.4}
.note{color:var(--muted);font-size:.9rem;line-height:1.5;margin:0;max-width:65ch}
.warn{color:var(--bad);font-weight:600;font-size:.92rem}

/* door picker */
.doorpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.door{border-radius:22px 22px 10px 10px;padding:22px 14px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:1.1rem;color:#fff;min-height:190px;justify-content:flex-end;position:relative}
.door .hero{font-size:3.2rem}
.door::after{content:"";position:absolute;right:16px;top:50%;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.75)}
.door.en{background:var(--en)} .door.ru{background:var(--ru)} .door.ua{background:var(--ua);color:var(--ink)}

/* play */
.bar{display:flex;align-items:center;gap:12px}
.back{background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700}
.progress{flex:1;height:10px;background:var(--card);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}
.count{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.stage{border-radius:24px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:16px;border:4px solid var(--line);background:var(--card)}
.stage.en{border-color:var(--en);background:linear-gradient(var(--en-soft),var(--card) 60%)}
.stage.ru{border-color:var(--ru);background:linear-gradient(var(--ru-soft),var(--card) 60%)}
.stage.ua{border-color:var(--ua);background:linear-gradient(var(--ua-soft),var(--card) 60%)}
.who{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted)}
.who .hero{font-size:1.8rem}
.ask{font-weight:700;color:var(--muted);text-align:center}
.word{font-family:var(--f-word);font-weight:700;font-size:clamp(2.6rem,11vw,4.6rem);line-height:1.1;min-height:1.2em;letter-spacing:.02em;text-align:center;overflow-wrap:anywhere}
.word .mask{color:var(--line);letter-spacing:.1em}
.word mark{background:none;border-bottom:6px solid currentColor;padding:0 2px}
.word mark.en{color:var(--en)} .word mark.ru{color:var(--ru)} .word mark.ua{color:var(--ua-ink);border-color:var(--ua)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px;width:100%}
.opt{background:var(--card);border:3px solid var(--line);border-radius:20px;font-size:3.2rem;padding:14px 0;line-height:1;transition:transform .12s}
.opt:hover{transform:scale(1.04)}
.opt.right{border-color:var(--ok);background:#E2F5EA}
.opt.wrong{border-color:var(--bad);background:#FBE3E7}
.opt.door3{font-size:1.1rem;font-weight:800;padding:18px 8px;display:flex;flex-direction:column;gap:6px;align-items:center;color:#fff;border:0}
.opt.door3 .hero{font-size:2.2rem}
.opt.door3.en{background:var(--en)} .opt.door3.ru{background:var(--ru)} .opt.door3.ua{background:var(--ua);color:var(--ink)}
.opt.door3.right{outline:5px solid var(--ok);outline-offset:3px}
.opt.door3.wrong{outline:5px solid var(--bad);outline-offset:3px;opacity:.6}
.tip{min-height:1.5em;text-align:center;font-weight:600;max-width:46ch;line-height:1.45}
.tip.ok{color:var(--ok)} .tip.bad{color:var(--bad)}
.speed{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;font-size:.95rem}
.speed b{color:var(--ink)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.12)}}

/* schulte */
.grid{display:grid;gap:8px;width:100%;max-width:440px}
.cell{aspect-ratio:1;max-width:100%;background:var(--card);border:3px solid var(--line);border-radius:14px;font-family:var(--f-word);font-weight:700;font-size:clamp(1.4rem,7vw,2.4rem)}
.cell.done{background:var(--paper);color:var(--line);border-color:transparent}
.target{font-family:var(--f-word);font-weight:700;font-size:2.4rem;color:var(--ink);display:inline-block;min-width:1.4em;text-align:center}

/* result */
.result{align-items:center;text-align:center}
.big{font-size:3rem;letter-spacing:.1em}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{padding:12px 20px;border-radius:14px;font-weight:800;background:var(--ink);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}

@media (max-width:480px){.modes{grid-template-columns:minmax(0,1fr)}.opt{font-size:2.6rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span class="doors" aria-hidden="true"><i style="background:var(--en)"></i><i style="background:var(--ru)"></i><i style="background:var(--ua)"></i></span><h1 id="t-title">Три дверцы</h1></div>
    <div class="row">
      <div class="seg" role="group" aria-label="UI" id="uiSeg">
        <button data-ui="ru">RU</button><button data-ui="ua">UA</button><button data-ui="en">EN</button>
      </div>
      <span class="stars" id="starCount">⭐ 0</span>
    </div>
  </header>

  <!-- HOME -->
  <section id="home" class="app" style="gap:16px">
    <div class="modes" id="modeList"></div>
    <div class="panel">
      <div class="lbl" id="t-langs"></div>
      <div class="row" id="langChips"></div>
      <div class="warn" id="needTwo" hidden></div>
      <div class="lbl" id="t-level"></div>
      <div class="row" id="levelChips"></div>
      <div class="row">
        <button class="chip plain" id="capsBtn"></button>
        <button class="chip plain" id="soundBtn"></button>
      </div>
      <p class="note" id="voiceNote" hidden></p>
    </div>
    <div class="panel">
      <div class="lbl" id="t-parent"></div>
      <p class="note" id="t-parentText"></p>
    </div>
  </section>

  <!-- DOOR PICK -->
  <section id="pick" class="app" hidden>
    <div class="bar"><button class="back" data-home>←</button><h2 id="pickTitle" style="font-size:1.2rem"></h2></div>
    <div class="doorpick" id="doorList"></div>
  </section>

  <!-- PLAY (picture, flash, which) -->
  <section id="play" class="app" hidden>
    <div class="bar"><button class="back" data-home>←</button><div class="progress"><i id="prog"></i></div><span class="count" id="countTxt"></span></div>
    <div class="stage" id="stage">
      <div class="who" id="who"></div>
      <div class="ask" id="ask"></div>
      <div class="word" id="word" aria-live="polite"></div>
      <div class="speed" id="speed" hidden></div>
      <div class="opts" id="opts"></div>
      <div class="tip" id="tip"></div>
    </div>
  </section>

  <!-- SCHULTE -->
  <section id="schulte" class="app" hidden>
    <div class="bar"><button class="back" data-home>←</button><span class="count" id="sTimer" style="margin-left:auto">0.0</span></div>
    <div class="stage" id="sStage">
      <div class="who" id="sWho"></div>
      <div class="ask"><span id="t-find"></span> <span class="target" id="sTarget"></span></div>
      <div class="grid" id="sGrid"></div>
      <div class="tip" id="sTip"></div>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="app" hidden>
    <div class="panel result">
      <div class="big" id="rStars"></div>
      <h2 id="rTitle"></h2>
      <p class="note" id="rText"></p>
      <div class="btns"><button class="btn" id="againBtn"></button><button class="btn ghost" data-home id="homeBtn"></button></div>
    </div>
  </section>
</div>

  caps:'ВЕЛИКІ літери',sound:'Голос',needTwo:'Для цієї гри потрібні хоча б дві мови.',

};

/* ---------- state & storage ---------- */
const store = {
  get(k,d){try{const v=localStorage.getItem('tridv:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('tridv:'+k,JSON.stringify(v))}catch(e){}}
};
const S = {
  ui:store.get('ui','ru'), langs:store.get('langs',['en','ru','ua']), level:store.get('level',1),
  caps:store.get('caps',false), sound:store.get('sound',true), stars:store.get('stars',0)
};
const t = k => T[S.ui][k];
const fmt = (s,o)=>s.replace(/\{(\w)\}/g,(_,k)=>o[k]);
const $ = id => document.getElementById(id);
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const show = txt => S.caps ? txt.toUpperCase() : txt;

/* ---------- voice ---------- */
let voices=[];
function loadVoices(){ try{voices=speechSynthesis.getVoices()}catch(e){voices=[]} renderVoiceNote(); }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
const voiceFor = l => voices.find(v=>v.lang.toLowerCase().replace('_','-').startsWith(LANG[l].voice));
function say(text,l){
  if(!S.sound||!('speechSynthesis' in window))return;
  const v=voiceFor(l); if(!v)return; // never read a language with another language's voice
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=.85;speechSynthesis.speak(u)}catch(e){}
}
function renderVoiceNote(){
  const el=$('voiceNote'); if(!el)return;
  if(!S.sound||!voices.length){el.hidden=true;return}
  const miss=S.langs.filter(l=>!voiceFor(l)).map(l=>LANG[l].name);
  el.hidden=!miss.length; el.textContent=miss.length?fmt(t('noVoice'),{x:miss.join(', ')}):'';
}

/* ---------- screens ---------- */
const SCREENS=['home','pick','play','schulte','result'];
function go(id){ SCREENS.forEach(s=>$(s).hidden=s!==id); clearTimers(); window.scrollTo(0,0); }
let timers=[]; const later=(f,ms)=>timers.push(setTimeout(f,ms));
function clearTimers(){timers.forEach(clearTimeout);timers=[];if(sTick){clearInterval(sTick);sTick=null}}
document.addEventListener('click',e=>{ if(e.target.closest('[data-home]')){ go('home'); renderHome(); } });

function addStars(n){S.stars+=n;store.set('stars',S.stars);$('starCount').textContent='⭐ '+S.stars}

/* ---------- home ---------- */
function renderHome(){
  document.documentElement.lang = S.ui==='ua'?'uk':S.ui;
  $('t-title').textContent=t('title'); document.title=t('title');
  [...$('uiSeg').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.ui===S.ui));
  $('starCount').textContent='⭐ '+S.stars;
  const icons=['<b>к</b><b>і</b><b>т</b>','<b>⚡</b>','<b>ы</b><b>?</b><b>ї</b>','<b>А</b><b>Б</b><b>В</b>'];
  $('modeList').innerHTML=t('m').map((m,i)=>`<button class="mode" data-mode="${i}"><span class="ico">${icons[i]}</span><h2>${m[0]}</h2><p>${m[1]}</p></button>`).join('');
  $('t-langs').textContent=t('langs'); $('t-level').textContent=t('level');
  $('langChips').innerHTML=['en','ru','ua'].map(l=>`<button class="chip ${l}" data-lang="${l}" aria-pressed="${S.langs.includes(l)}"><span>${LANG[l].hero}</span>${LANG[l].name}</button>`).join('');
  $('levelChips').innerHTML=t('lv').map((n,i)=>`<button class="chip plain" data-level="${i+1}" aria-pressed="${S.level===i+1}">${n}</button>`).join('');
  $('capsBtn').textContent=(S.caps?'✓ ':'')+t('caps'); $('capsBtn').setAttribute('aria-pressed',S.caps);
  $('soundBtn').textContent=(S.sound?'🔊 ':'🔇 ')+t('sound'); $('soundBtn').setAttribute('aria-pressed',S.sound);
  $('t-parent').textContent=t('parent'); $('t-parentText').textContent=t('parentText');
  $('needTwo').hidden=true; renderVoiceNote();
}
$('uiSeg').addEventListener('click',e=>{const b=e.target.closest('[data-ui]');if(!b)return;S.ui=b.dataset.ui;store.set('ui',S.ui);renderHome()});
$('langChips').addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(!b)return;const l=b.dataset.lang;
  if(S.langs.includes(l)){ if(S.langs.length>1) S.langs=S.langs.filter(x=>x!==l);} else S.langs=['en','ru','ua'].filter(x=>x===l||S.langs.includes(x));
  store.set('langs',S.langs);renderHome()});
$('levelChips').addEventListener('click',e=>{const b=e.target.closest('[data-level]');if(!b)return;S.level=+b.dataset.level;store.set('level',S.level);renderHome()});
$('capsBtn').onclick=()=>{S.caps=!S.caps;store.set('caps',S.caps);renderHome()};
$('soundBtn').onclick=()=>{S.sound=!S.sound;store.set('sound',S.sound);renderHome()};
$('modeList').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;const m=+b.dataset.mode;
  if(m===2){ if(S.langs.length<2){$('needTwo').textContent=t('needTwo');$('needTwo').hidden=false;return} startWhich(); }
  else if(S.langs.length===1) startMode(m,S.langs[0]);
  else pickDoor(m);
});

function pickDoor(m){
  go('pick'); $('pickTitle').textContent=t('pick');
  $('doorList').innerHTML=S.langs.map(l=>`<button class="door ${l}" data-door="${l}"><span class="hero">${LANG[l].hero}</span>${LANG[l].name}</button>`).join('');
  $('doorList').onclick=e=>{const b=e.target.closest('[data-door]');if(b)startMode(m,b.dataset.door)};
}
let last={m:0,l:'en'};
function startMode(m,l){ last={m,l}; if(m===3) startSchulte(l); else startPictures(l,m===1); }

/* ---------- picture & flash ---------- */
const norm = s => s.toLowerCase().replace(/[aceopxyik]/g,c=>({a:'а',c:'с',e:'е',o:'о',p:'р',x:'х',y:'у',i:'і',k:'к'})[c]);
function dist(a,b){const m=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function optionsFor(item,l,n,nTraps){
  const w=norm(item[l]), near=Math.max(1,Math.floor(w.length/4));
  // traps: a picture whose word in any language looks like this one; then words starting with the same letters
  let traps=shuffle(WORDS.filter(x=>x!==item&&['en','ru','ua'].some(k=>dist(norm(x[k]),w)<=near)));
  traps=traps.concat(shuffle(WORDS.filter(x=>x!==item&&!traps.includes(x)&&x[l].slice(0,2)===item[l].slice(0,2))));
  const picked=traps.slice(0,nTraps);
  for(const x of shuffle(WORDS)){ if(picked.length>=n-1)break; if(x!==item&&!picked.includes(x)) picked.push(x); }
  return shuffle([item,...picked]);
}
let G=null;
function startPictures(l,flash){
  const lv=LEVEL[S.level];
  let pool=WORDS.filter(x=>x[l].length>=lv.min&&x[l].length<=lv.len);
  if(pool.length<ROUND) pool=WORDS.slice().sort((a,b)=>a[l].length-b[l].length).slice(0,ROUND*2);
  // short words first inside a round, so it warms up and then gets harder
  const items=shuffle(pool).slice(0,ROUND).sort((a,b)=>a[l].length-b[l].length);
  G={kind:flash?'flash':'pic',l,items,i:0,right:0,ms:lv.flash,best:null};
  go('play'); nextPicture();
}
function header(l){
  $('stage').className='stage '+(l||'');
  $('who').innerHTML=l?`<span class="hero">${LANG[l].hero}</span>${LANG[l].name}`:'';
  $('prog').style.width=(G.i/ROUND*100)+'%'; $('countTxt').textContent=`${G.i+1}/${ROUND}`;
  $('tip').textContent=''; $('tip').className='tip';
}
function nextPicture(){
  if(G.i>=ROUND) return finish();
  const item=G.items[G.i], l=G.l; header(l);
  $('ask').textContent=G.kind==='flash'?t('flash'):t('read');
  const opts=optionsFor(item,l,LEVEL[S.level].opts,LEVEL[S.level].traps);
  $('opts').style.gridTemplateColumns=`repeat(${opts.length},minmax(0,1fr))`;
  $('opts').innerHTML=opts.map((o,k)=>`<button class="opt" data-k="${k}" aria-label="${o.en}">${o.e}</button>`).join('');
  let locked=false;
  const word=show(item[l]);
  if(G.kind==='flash'){
    renderSpeed(); $('word').textContent=word; $('opts').style.visibility='hidden';
    later(()=>{ $('word').innerHTML=`<span class="mask">${'■'.repeat(Math.min(word.length,7))}</span>`; $('opts').style.visibility='visible'; }, G.ms);
  } else { $('speed').hidden=true; $('word').textContent=word; $('opts').style.visibility='visible'; }
  $('opts').onclick=e=>{
    const b=e.target.closest('.opt'); if(!b||locked)return; locked=true;
    const o=opts[+b.dataset.k], ok=o===item;
    $('word').textContent=word;
    if(ok){ b.classList.add('right','pop'); G.right++; $('tip').textContent=rnd(t('ok')); $('tip').className='tip ok'; say(item[l],l);
      if(G.kind==='flash'){ G.best=G.best?Math.min(G.best,G.ms):G.ms; G.ms=Math.max(120,Math.round(G.ms*.82)); }
      G.i++; later(nextPicture,1100);
    } else {
      b.classList.add('wrong','shake');
      $('opts').children[opts.indexOf(item)].classList.add('right');
      $('tip').textContent=`${t('no')} ${item.e} ${word}`; $('tip').className='tip bad'; say(item[l],l);
      if(G.kind==='flash') G.ms=Math.min(3000,Math.round(G.ms*1.3));
      G.i++; later(nextPicture,2000);
    }
  };
}
function renderSpeed(){
  const best=store.get('flash:'+G.l,null);
  $('speed').hidden=false;
  $('speed').innerHTML=`${t('show')}: <b>${G.ms} ${t('ms')}</b>${best?` · ${t('rec')} ${best} ${t('ms')}`:''}`;
}

/* ---------- which language ---------- */
function startWhich(){
  const ls=S.langs; let items=[];
  const lv=LEVEL[S.level];
  ls.forEach(l=>{ let ws=WHICH[l].filter(w=>w.length>=Math.min(lv.min,5)&&w.length<=lv.len); if(ws.length<6) ws=WHICH[l];
    shuffle(ws).slice(0,6).forEach(w=>items.push({w,l})); });
  G={kind:'which',items:shuffle(items).slice(0,ROUND),i:0,right:0};
  last={m:2}; go('play'); nextWhich();
}
function markClue(w,l){
  const shown=show(w);
  if(l==='en') return `<mark class="en">${shown}</mark>`;
  return [...shown].map(c=>CLUE[l].test(c)?`<mark class="${l}">${c}</mark>`:c).join('');
}
function nextWhich(){
  if(G.i>=ROUND) return finish();
  const it=G.items[G.i]; header(null); $('speed').hidden=true;
  $('ask').textContent=t('whose'); $('word').textContent=show(it.w); $('opts').style.visibility='visible';
  $('opts').style.gridTemplateColumns=`repeat(${S.langs.length},minmax(0,1fr))`;
  $('opts').innerHTML=S.langs.map(l=>`<button class="opt door3 ${l}" data-l="${l}"><span class="hero">${LANG[l].hero}</span>${LANG[l].name}</button>`).join('');
  let locked=false;
  $('opts').onclick=e=>{
    const b=e.target.closest('.opt'); if(!b||locked)return; locked=true;
    const ok=b.dataset.l===it.l;
    $('stage').className='stage '+it.l;
    $('word').innerHTML=markClue(it.w,it.l);
    const c=(it.w.match(CLUE[it.l])||[''])[0];
    const tip=fmt(t('clue')[it.l],{x:show(c)});
    if(ok){ b.classList.add('right','pop'); G.right++; $('tip').textContent=rnd(t('ok'))+' '+tip; $('tip').className='tip ok'; }
    else { b.classList.add('wrong','shake'); $('opts').querySelector(`[data-l="${it.l}"]`).classList.add('right'); $('tip').textContent=tip; $('tip').className='tip bad'; }
    say(it.w,it.l); G.i++; later(nextWhich,ok?1500:2600);
  };
}

/* ---------- schulte alphabet ---------- */
let sTick=null;
function startSchulte(l){
  const g=LEVEL[S.level].grid, letters=g?[...ABC[l]].slice(0,g*g):[...ABC[l]], n=g||6;
  G={kind:'schulte',l,letters,next:0,start:0,mistakes:0};
  go('schulte');
  $('sStage').className='stage '+l; $('sWho').innerHTML=`<span class="hero">${LANG[l].hero}</span>${LANG[l].name}`;
  $('t-find').textContent=t('find'); $('sTip').textContent='';
  const grid=$('sGrid'); grid.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;
  const lc = c => S.caps?c:c.toLowerCase();
  grid.innerHTML=shuffle(letters).map(c=>`<button class="cell" data-c="${c}">${lc(c)}</button>`).join('');
  $('sTarget').textContent=lc(letters[0]); $('sTimer').textContent='0.0';
  grid.onclick=e=>{
    const b=e.target.closest('.cell'); if(!b||b.classList.contains('done'))return;
    if(!G.start){G.start=performance.now(); sTick=setInterval(()=>$('sTimer').textContent=((performance.now()-G.start)/1000).toFixed(1),100);}
    if(b.dataset.c===G.letters[G.next]){
      b.classList.add('done'); G.next++;
      if(G.next>=G.letters.length){ clearInterval(sTick); sTick=null; G.time=(performance.now()-G.start)/1000; return later(finish,500); }
      $('sTarget').textContent=lc(G.letters[G.next]);
    } else { G.mistakes++; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
  };
}

/* ---------- finish ---------- */
function finish(){
  let stars, text;
  if(G.kind==='schulte'){
    const key=`schulte:${G.l}:${G.letters.length}`, prev=store.get(key,null), tm=+G.time.toFixed(1);
    if(!prev||tm<prev) store.set(key,tm);
    const per=G.time/G.letters.length; stars = G.mistakes<=1&&per<2.5?3: G.mistakes<=4?2:1;
    text=fmt(t('rTime'),{x:tm})+(prev?fmt(t('rBest'),{x:Math.min(prev,tm)}):'');
  } else {
    stars = G.right>=9?3: G.right>=6?2:1;
    text=fmt(t('rText'),{a:G.right,b:ROUND});
    if(G.kind==='flash'&&G.best){ const prev=store.get('flash:'+G.l,null); if(!prev||G.best<prev) store.set('flash:'+G.l,G.best); text+=fmt(t('rFlash'),{x:G.best}); }
  }
  addStars(stars);
  go('result');
  $('rStars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);
  $('rTitle').textContent=t(['r1','r2','r3'][stars-1]); $('rText').textContent=text;
  $('againBtn').textContent=t('again'); $('homeBtn').textContent=t('home');
}
$('againBtn').onclick=()=>{ if(last.m===2) startWhich(); else startMode(last.m,last.l); };

renderHome();
})();
</script>

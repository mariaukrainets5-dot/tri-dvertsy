<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Три дверцы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: one column "playroom"; each language owns a colour + hero so the brain switches alphabet by context; the plan is a path across a picture-book meadow */
:root{
  --paper:#EDF0F6; --card:#FFFFFF; --ink:#1C2333; --muted:#5D6678; --line:#D5DAE6;
  --en:#2D5BD8; --en-soft:#E3EAFC;
  --ru:#D9472A; --ru-soft:#FBE6E0;
  --ua:#E0A400; --ua-soft:#FFF3CC; --ua-ink:#7A5700;
  --ok:#1E9A5A; --ok-soft:#E2F5EA; --bad:#C8364B; --bad-soft:#FBE3E7; --gold:#F2B705;
  --f-word:"Andika","Trebuchet MS",system-ui,sans-serif;
  --f-ui:"Rubik","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.app .app{width:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button:disabled{cursor:default;opacity:.45}
h1,h2,h3{margin:0;text-wrap:balance}
img{user-select:none;-webkit-user-drag:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.doors{display:flex;gap:4px}
.doors i{display:block;width:14px;height:22px;border-radius:7px 7px 2px 2px}
.brand h1{font-size:1.45rem;font-weight:800;letter-spacing:-.01em}
.stars{font-weight:700;background:var(--card);border-radius:999px;padding:6px 14px;font-variant-numeric:tabular-nums;display:inline-block}
.stars.pop{animation:pop .4s}
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.panel{background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);font-weight:700;background:var(--card)}
.chip img{width:26px;height:26px;object-fit:contain}
.chip[aria-pressed="true"].en{border-color:var(--en);background:var(--en-soft)}
.chip[aria-pressed="true"].ru{border-color:var(--ru);background:var(--ru-soft)}
.chip[aria-pressed="true"].ua{border-color:var(--ua);background:var(--ua-soft)}
.chip[aria-pressed="true"].plain{border-color:var(--ink);background:var(--paper)}
.field{display:flex;flex-direction:column;gap:8px}
.input{font:inherit;font-weight:600;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%;max-width:360px}
.note{color:var(--muted);font-size:.92rem;line-height:1.5;margin:0;max-width:65ch}
.warn{color:var(--bad);font-weight:600;font-size:.92rem}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:13px 22px;border-radius:14px;font-weight:800;background:var(--ink);color:#fff;font-size:1.02rem}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.small{padding:9px 14px;font-size:.9rem}
.btn.danger{background:var(--bad)}
.link{color:var(--muted);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:.92rem}

/* hero + speech bubble */
.say{display:flex;align-items:flex-end;gap:12px}
.say img{width:96px;height:96px;object-fit:contain;flex:none;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
.say .bubble{background:var(--card);border-radius:18px 18px 18px 4px;padding:12px 16px;font-weight:600;line-height:1.4;position:relative;min-width:0;box-shadow:0 2px 0 var(--line)}
.say.big img{width:140px;height:140px}
.say .bubble h2{font-size:1.3rem;font-weight:800}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-1.5deg)}}

/* map path */
.map{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:16/10;max-width:100%;background:#cfe3c4 url(art/map.webp) center/cover;box-shadow:inset 0 0 0 4px rgba(255,255,255,.5)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.stone{position:absolute;width:clamp(34px,7.5vw,52px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:rgba(255,255,255,.86);border:3px solid #fff;display:grid;place-items:center;font-weight:800;font-size:clamp(.8rem,2.4vw,1rem);color:var(--muted);
  box-shadow:0 3px 0 rgba(28,35,51,.18)}
.stone img{width:118%;height:118%;object-fit:contain;max-width:none}
.stone.done{background:#fff}
.stone.test{border-color:var(--gold)}
.stone.now{background:var(--ink);color:#fff;border-color:#fff;animation:pulse 1.6s ease-in-out infinite}
.stone.locked{opacity:.72}
.walker{position:absolute;width:clamp(46px,11vw,78px);transform:translate(-50%,-100%);pointer-events:none;transition:left .9s ease,top .9s ease}
.walker img{width:100%;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(28,35,51,.45)}50%{box-shadow:0 0 0 12px rgba(28,35,51,0)}}

/* missions */
.missions{display:flex;flex-direction:column;gap:10px}
.mission{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;background:var(--card);border:2px solid var(--line);text-align:left;width:100%}
.mission:not(:disabled):hover{border-color:var(--ink)}
.mission .mi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-word);font-weight:700;font-size:1.25rem;flex:none;color:#fff}
.mission .mi.en{background:var(--en)} .mission .mi.ru{background:var(--ru)} .mission .mi.ua{background:var(--ua);color:var(--ink)} .mission .mi.mix{background:linear-gradient(135deg,var(--en) 33%,var(--ru) 33% 66%,var(--ua) 66%)}
.mission .mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mission .mt b{font-size:1.02rem}
.mission .mt span{color:var(--muted);font-size:.88rem}
.mission .ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:800}
.mission.done{background:var(--ok-soft);border-color:transparent}
.mission.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.mission.next{border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}

.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mode{background:var(--card);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;border:2px solid transparent;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-2px);border-color:var(--ink)}
.mode .ico{font-family:var(--f-word);font-size:1.5rem;font-weight:700;height:34px;display:flex;align-items:center;gap:2px}
.mode .ico b:nth-child(1){color:var(--en)} .mode .ico b:nth-child(2){color:var(--ru)} .mode .ico b:nth-child(3){color:var(--ua)}
.mode h3{font-size:.98rem}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;font-weight:700;text-align:left;border:2px solid transparent}
.tile:hover{border-color:var(--ink)}
.tile img{width:44px;height:44px;object-fit:contain}

/* door picker */
.doorpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.door{border-radius:22px 22px 10px 10px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:1.1rem;color:#fff;min-height:200px;justify-content:flex-end;position:relative}
.door img{width:110px;height:110px;object-fit:contain;transition:transform .2s}
.door:hover img{transform:scale(1.08) rotate(-3deg)}
.door::after{content:"";position:absolute;right:16px;top:50%;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.75)}
.door.en{background:var(--en)} .door.ru{background:var(--ru)} .door.ua{background:var(--ua);color:var(--ink)}

/* play */
.bar{display:flex;align-items:center;gap:12px}
.back{background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700}
.progress{flex:1;height:10px;background:var(--card);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}
.count{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.stage{border-radius:24px;padding:20px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;border:4px solid var(--line);background:var(--card);position:relative}
.stage.en{border-color:var(--en);background:linear-gradient(var(--en-soft),var(--card) 60%)}
.stage.ru{border-color:var(--ru);background:linear-gradient(var(--ru-soft),var(--card) 60%)}
.stage.ua{border-color:var(--ua);background:linear-gradient(var(--ua-soft),var(--card) 60%)}
.who{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--muted);min-height:64px;align-self:stretch;justify-content:center}
.who img{width:64px;height:64px;object-fit:contain}
.who img.joy{animation:jump .6s ease}
.who img.sad{animation:nope .5s ease}
@keyframes jump{30%{transform:translateY(-14px) scale(1.08)}60%{transform:translateY(0) scale(.96)}}
@keyframes nope{20%{transform:rotate(-10deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(3deg)}}
.streak{position:absolute;top:12px;right:14px;background:var(--ink);color:#fff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.streak.pop{animation:pop .35s}
.ask{font-weight:700;color:var(--muted);text-align:center}
.word{font-family:var(--f-word);font-weight:700;font-size:clamp(2.6rem,11vw,4.6rem);line-height:1.1;min-height:1.2em;letter-spacing:.02em;text-align:center;overflow-wrap:anywhere;padding-bottom:6px}
.word .mask{color:var(--line);letter-spacing:.1em}
.word mark{background:none;border-bottom:6px solid currentColor;padding:0 2px}
.word mark.en{color:var(--en)} .word mark.ru{color:var(--ru)} .word mark.ua{color:var(--ua-ink);border-color:var(--ua)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px;width:100%}
.opt{background:var(--card);border:3px solid var(--line);border-radius:20px;font-size:3.2rem;padding:14px 0;line-height:1;transition:transform .12s}
.opt:hover{transform:scale(1.04)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.door3{font-size:1.05rem;font-weight:800;padding:14px 6px;display:flex;flex-direction:column;gap:4px;align-items:center;color:#fff;border:0}
.opt.door3 img{width:64px;height:64px;object-fit:contain}
.opt.door3.en{background:var(--en)} .opt.door3.ru{background:var(--ru)} .opt.door3.ua{background:var(--ua);color:var(--ink)}
.opt.door3.right{outline:5px solid var(--ok);outline-offset:3px}
.opt.door3.wrong{outline:5px solid var(--bad);outline-offset:3px;opacity:.6}
.tip{min-height:1.5em;text-align:center;font-weight:600;max-width:46ch;line-height:1.45}
.tip.ok{color:var(--ok)} .tip.bad{color:var(--bad)}
.speed{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;font-size:.95rem}
.speed b{color:var(--ink)}
.intro{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:10px 0}
.intro img{width:170px;height:170px;object-fit:contain;animation:bob 3s ease-in-out infinite}
.intro h2{font-size:1.4rem}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.14)}}

/* letters track */
.lcard{display:flex;align-items:center;gap:22px;justify-content:center;flex-wrap:wrap}
.bigl{font-family:var(--f-word);font-weight:700;font-size:clamp(4rem,18vw,6.5rem);line-height:1;padding:12px 26px;border-radius:24px;background:var(--card);border:4px solid var(--line);letter-spacing:.04em}
.stage.en .bigl{border-color:var(--en);color:var(--en)} .stage.ru .bigl{border-color:var(--ru);color:var(--ru)} .stage.ua .bigl{border-color:var(--ua);color:var(--ua-ink)}
.anc{display:flex;flex-direction:column;align-items:center;gap:2px}
.anc .em{font-size:4.2rem;line-height:1.1}
.anc .aw{font-family:var(--f-word);font-size:1.9rem;font-weight:700}
.anc .aw b{text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:5px}
.replay{font-size:2.4rem;width:92px;height:92px;border-radius:50%;background:var(--card);border:3px solid var(--line);animation:pulse 2s ease-in-out infinite}
.pic{display:flex;align-items:center;gap:16px;justify-content:center}
.pic .em{font-size:clamp(4rem,16vw,5.5rem);line-height:1}
.pic .replay{width:72px;height:72px;font-size:1.9rem}
.opt.letter{font-family:var(--f-word);font-weight:700;font-size:3rem}
.lslots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.lslot{width:54px;height:64px;border-bottom:5px solid var(--ink);font-family:var(--f-word);font-size:2.4rem;font-weight:700;display:grid;place-items:center}
.lslot.on{animation:pop .3s}
.ltiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ltile{width:62px;height:62px;border-radius:16px;background:var(--card);border:3px solid var(--line);font-family:var(--f-word);font-size:2.1rem;font-weight:700}
.ltile:disabled{opacity:.2}
/* blending */
.slide{display:flex;align-items:flex-end;justify-content:center;gap:clamp(40px,14vw,110px);transition:gap .9s cubic-bezier(.5,0,.3,1);padding:14px 0 16px;position:relative;width:100%}
.slide::before{content:"";position:absolute;left:12%;right:12%;bottom:4px;height:8px;border-radius:8px;background:var(--line)}
.slide .st{font-family:var(--f-word);font-weight:700;font-size:clamp(3.4rem,15vw,5.4rem);line-height:1;padding:8px 14px;border-radius:18px;background:var(--card);border:4px solid var(--line);transition:transform .4s,border-color .4s,background .4s;position:relative}
.stage.en .slide .st.v{color:var(--en)} .stage.ru .slide .st.v{color:var(--ru)} .stage.ua .slide .st.v{color:var(--ua-ink)}
.slide:not(.joined) .st:first-child{animation:nudge 1.3s ease-in-out infinite}
.slide.joined .st{border-color:transparent;background:transparent;transform:scale(1.12)}
.slide.joined{gap:0}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
.sylchips{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;transition:gap .7s}
.chip-s{font-family:var(--f-word);font-weight:700;font-size:clamp(2.2rem,10vw,3rem);padding:6px 14px;border-radius:16px;background:var(--card);border:3px solid var(--line);transition:all .5s}
.chip-s.on{border-color:var(--ink)}
.sylchips.joined{gap:0} .sylchips.joined .chip-s{border-color:transparent;background:transparent;padding:6px 1px}
.opt.syl{font-family:var(--f-word);font-weight:700;font-size:2.4rem}
/* letter morphs */
.morph{width:min(300px,70vw);aspect-ratio:1;max-width:100%;border-radius:24px;background:#fbf1de;object-fit:cover;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.mcard{display:flex;flex-direction:column;align-items:center;gap:8px}
.mcard .aw{font-family:var(--f-word);font-size:1.9rem;font-weight:700}
.mcard .aw b{text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:5px}
/* schulte */
.grid{display:grid;gap:8px;width:100%;max-width:440px}
.cell{aspect-ratio:1;max-width:100%;background:var(--card);border:3px solid var(--line);border-radius:14px;font-family:var(--f-word);font-weight:700;font-size:clamp(1.2rem,6vw,2.2rem)}
.cell.done{background:var(--paper);color:var(--line);border-color:transparent;transform:scale(.92);transition:transform .15s}
.target{font-family:var(--f-word);font-weight:700;font-size:2.4rem;color:var(--ink);display:inline-block;min-width:1.4em;text-align:center}

/* report */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.rcard{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;border:3px solid var(--line);background:var(--card)}
.rcard.en{border-color:var(--en)} .rcard.ru{border-color:var(--ru)} .rcard.ua{border-color:var(--ua)}
.rcard h3{display:flex;align-items:center;gap:8px;font-size:1.05rem}
.rcard h3 img{width:40px;height:40px;object-fit:contain}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;color:var(--muted)}
.kv b{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.meter{height:8px;border-radius:999px;background:var(--paper);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--ink)}
.pill{display:inline-flex;padding:4px 10px;border-radius:999px;background:var(--paper);font-weight:700;font-size:.88rem;font-family:var(--f-word)}
.hist{display:flex;flex-direction:column;gap:6px}
.hist div{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;padding:6px 0;border-bottom:1px solid var(--line)}
.hist div span:last-child{font-variant-numeric:tabular-nums;font-weight:700}
.lvrow{display:flex;align-items:center;gap:10px}
.lvrow .name{flex:1;font-weight:700;display:flex;align-items:center;gap:8px}
.lvrow img{width:30px;height:30px;object-fit:contain}
.lvrow .val{min-width:7.5em;text-align:center;font-weight:700}
.step{width:36px;height:36px;border-radius:50%;background:var(--paper);font-weight:800;font-size:1.1rem}

/* album */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.slot{aspect-ratio:1;max-width:100%;border-radius:18px;background:var(--card);display:grid;place-items:center;border:2px dashed var(--line);position:relative}
.slot img{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain}
.slot.got{border-style:solid;border-color:transparent}
.slot.got img{animation:none}
.slot.empty img{filter:grayscale(1) brightness(1.15);opacity:.18}
.slot span{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:.75rem;font-weight:700;color:var(--muted)}

/* result + modal */
.result{align-items:center;text-align:center}
.result img.hero{width:150px;height:150px;object-fit:contain;animation:jump 1s ease 2}
.bigstars{font-size:2.6rem;letter-spacing:.1em}
.modal{position:fixed;inset:0;background:rgba(28,35,51,.55);display:grid;place-items:center;z-index:40;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .panel{max-width:420px;width:100%;align-items:center;text-align:center}
.modal .sticker{width:190px;height:190px;object-fit:contain;animation:stick .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes stick{0%{transform:scale(.2) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-4deg);opacity:1}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;max-width:calc(100% - 32px);text-align:center}

@media (max-width:620px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.opt{font-size:2.6rem}.say img{width:76px;height:76px}.say.big img{width:110px;height:110px}.map{aspect-ratio:4/3}.tiles{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="confetti" hidden></canvas>
<div class="app">
  <header class="top">
    <div class="brand"><span class="doors" aria-hidden="true"><i style="background:var(--en)"></i><i style="background:var(--ru)"></i><i style="background:var(--ua)"></i></span><h1 id="t-title">Три дверцы</h1></div>
    <div class="row">
      <div class="seg" role="group" aria-label="Interface language" id="uiSeg">
        <button data-ui="ru">RU</button><button data-ui="ua">UA</button><button data-ui="en">EN</button>
      </div>
      <span class="stars" id="starCount">⭐ 0</span>
    </div>
  </header>

  <!-- WELCOME: parent questionnaire -->
  <section id="welcome" class="app" hidden>
    <div class="say big"><img src="art/owl.webp" alt=""><div class="bubble"><h2 id="w-title"></h2><p class="note" id="w-lead" style="margin-top:6px"></p></div></div>
    <form class="panel" id="wForm" novalidate>
      <div class="field"><label class="lbl" for="wName" id="w-qName"></label><input class="input" id="wName" maxlength="24" autocomplete="off"></div>
      <div class="field"><span class="lbl" id="w-qAge"></span><div class="row" id="wAge"></div></div>
      <div class="field"><span class="lbl" id="w-qLangs"></span><div class="row" id="wLangs"></div></div>
      <div class="field"><span class="lbl" id="w-qSchool"></span><div class="row" id="wSchool"></div></div>
      <div class="field"><span class="lbl" id="w-qMin"></span><div class="row" id="wMin"></div></div>
      <div class="field"><span class="lbl" id="w-qAbc"></span><div class="row" id="wAbc"></div></div>
      <div class="field"><span class="lbl" id="w-qGoal"></span><div class="row" id="wGoal"></div></div>
      <div class="warn" id="wWarn" hidden></div>
      <div class="btns"><button class="btn" type="submit" id="w-start"></button><button class="btn ghost" type="button" id="w-cancel" hidden></button></div>
    </form>
  </section>

  <!-- HOME: path + today's missions -->
  <section id="home" class="app" hidden>
    <div class="say"><img id="hHero" src="art/owl.webp" alt=""><div class="bubble" id="hSay"></div></div>
    <div class="map" id="map"></div>
    <div class="panel" id="todayPanel">
      <div class="row" style="justify-content:space-between"><span class="lbl" id="hDay"></span><button class="link" id="openNow" hidden></button></div>
      <div class="missions" id="missions"></div>
    </div>
    <div class="tiles">
      <button class="tile" data-go="album"><img src="art/st-book.webp" alt=""><span id="t-album"></span></button>
      <button class="tile" data-go="parent"><img src="art/st-key.webp" alt=""><span id="t-parentBtn"></span></button>
    </div>
    <div class="lbl" id="t-free"></div>
    <div class="modes" id="modeList"></div>
  </section>

  <!-- DOOR PICK -->
  <section id="pick" class="app" hidden>
    <div class="bar"><button class="back" data-home>←</button><h2 id="pickTitle" style="font-size:1.2rem"></h2></div>
    <div class="doorpick" id="doorList"></div>
  </section>

  <!-- PLAY -->
  <section id="play" class="app" hidden>
    <div class="bar"><button class="back" data-home>←</button><div class="progress"><i id="prog"></i></div><span class="count" id="countTxt"></span></div>
    <div class="stage" id="stage">
      <span class="streak" id="streak" hidden></span>
      <div class="who" id="who"></div>
      <div id="taskBody" style="display:contents">
        <div class="ask" id="ask"></div>
        <div class="word" id="word" aria-live="polite"></div>
        <div class="speed" id="speed" hidden></div>
        <div class="opts" id="opts"></div>
        <div class="tip" id="tip"></div>
        <button class="link" id="skipBtn" hidden></button>
      </div>
      <div class="intro" id="introBody" hidden></div>
    </div>
  </section>

  <!-- SCHULTE -->
  <section id="schulte" class="app" hidden>
    <div class="bar"><button class="back" data-home>←</button><span class="count" id="sTimer" style="margin-left:auto">0.0</span></div>
    <div class="stage" id="sStage">
      <div class="who" id="sWho"></div>
      <div class="ask"><span id="t-find"></span> <span class="target" id="sTarget"></span></div>
      <div class="grid" id="sGrid"></div>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="app" hidden>
    <div class="panel result">
      <img class="hero" id="rHero" src="art/owl-joy.webp" alt="">
      <div class="bigstars" id="rStars"></div>
      <h2 id="rTitle"></h2>
      <p class="note" id="rText"></p>
      <div class="btns" style="justify-content:center"><button class="btn" id="againBtn"></button><button class="btn ghost" data-home id="homeBtn"></button></div>
    </div>
  </section>

  <!-- REPORT (after a test) -->
  <section id="report" class="app" hidden>
    <div class="bar"><button class="back" data-home>←</button><h2 id="repTitle" style="font-size:1.2rem"></h2></div>
    <div class="cards" id="repCards"></div>
    <div class="panel" id="repMore"></div>
    <div class="btns"><button class="btn" data-home id="repGo"></button></div>
  </section>

  <!-- ALBUM -->
  <section id="album" class="app" hidden>
    <div class="bar"><button class="back" data-home>←</button><h2 id="alTitle" style="font-size:1.2rem"></h2></div>
    <p class="note" id="alLead"></p>
    <div class="album" id="albumGrid"></div>
  </section>

  <!-- PARENT -->
  <section id="parent" class="app" hidden>
    <div class="bar"><button class="back" data-home>←</button><h2 id="paTitle" style="font-size:1.2rem"></h2></div>
    <div class="panel"><span class="lbl" id="pa-kids"></span><div class="row" id="kidList"></div></div>
    <div class="panel" id="paSettings"></div>
    <div class="panel"><span class="lbl" id="pa-hist"></span><div class="hist" id="histList"></div></div>
    <div class="panel"><span class="lbl" id="pa-how"></span><p class="note" id="pa-howText"></p></div>
    <div class="panel" id="paPilot" hidden></div>
    <div class="panel" id="paDanger"></div>
  </section>
</div>
<div class="modal" id="modal" hidden><div class="panel" id="modalBody"></div></div>
<div class="toast" id="toast" hidden></div>

const voiceFor = l => voices.find(v=>v.lang.toLowerCase().replace('_','-').startsWith(LANG[l].voice));
function say(text,l){ return voice([[l,'w:'+text]]); }
function sysSay(text,l){
  if(!S.sound||!('speechSynthesis' in window))return;
  const v=voiceFor(l); if(!v)return; // never read a language with another language's voice
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=.85;speechSynthesis.speak(u)}catch(e){}
}
let AC=null;
function ac(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} return AC; }
/* recorded voices: one sprite per hero (voice/<lang>.mp3) + voice/index.json with [start, duration] per clip.
   Words are "w:<word>", hero lines "l:<key>". Without the files the game falls back to the system voice. */
const VO={idx:null,buf:{},cur:null,seq:0};
fetch('voice/index.json').then(r=>r.json()).then(j=>{VO.idx=j}).catch(()=>{});
const hasClip=(l,k)=>!!(VO.idx&&VO.idx[l]&&VO.idx[l][k]);
function sprite(l){
  if(!VO.buf[l]){ const a=ac(); if(!a) return Promise.resolve(null);
    VO.buf[l]=fetch(`voice/${l}.mp3`).then(r=>r.arrayBuffer()).then(b=>new Promise((ok,no)=>a.decodeAudioData(b,ok,no))).catch(()=>{VO.buf[l]=null;return null}); }
  return VO.buf[l];
}
function stopVoice(){ try{VO.cur&&VO.cur.stop()}catch(e){} VO.cur=null; }
function clip(l,k,id){
  return sprite(l).then(buf=>new Promise(res=>{
    if(!buf||VO.seq!==id) return res();
    stopVoice(); const [st,du]=VO.idx[l][k], src=AC.createBufferSource();
    src.buffer=buf; src.connect(AC.destination); src.onended=()=>res(); src.start(0,st,du); VO.cur=src;
  }));
}
// plays [lang,key] pairs one after another, cancelling whatever was playing; returns the total length in ms
function voice(seq){
  const id=++VO.seq; stopVoice();
  if(!S.sound) return 0;
  const list=seq.filter(([l,k])=>hasClip(l,k));
  if(!list.length){ const w=seq.find(([l,k])=>k.startsWith('w:')); if(w) sysSay(w[1].slice(2),w[0]); return 0; }
  (async()=>{ for(const [l,k] of list){ if(VO.seq!==id) return; await clip(l,k,id); } })();
  return Math.round(list.reduce((s,[l,k])=>s+VO.idx[l][k][1],0)*1000)+150*list.length;
}
const line = (l,...keys) => [l,'l:'+rnd(keys)];
function tone(f,dur,type,vol,delay){
  if(!S.sound||!ac())return;
  const o=AC.createOscillator(), g=AC.createGain(), t0=AC.currentTime+(delay||0);
  o.type=type||'triangle'; o.frequency.value=f;
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol||.12,t0+.012); g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+.05);
}

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('confetti'), dpr=devicePixelRatio||1; c.hidden=false;
  const x=c.getContext('2d'), W=c.width=innerWidth*dpr, H=c.height=innerHeight*dpr;
  const cols=['#2D5BD8','#D9472A','#E0A400','#1E9A5A','#F2B705'];
  const ps=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.35,y:H*.4,vx:(Math.random()-.5)*W*.022,vy:-Math.random()*H*.024-H*.006,r:(4+Math.random()*6)*dpr,c:rnd(cols),a:Math.random()*6,s:(Math.random()-.5)*.35}));
  let f=0;
  (function loop(){
    x.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=H*.0006;p.x+=p.vx;p.y+=p.vy;p.a+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore();});
    if(++f<140) requestAnimationFrame(loop); else {x.clearRect(0,0,W,H); c.hidden=true;}
  })();
}

/* ---------- task builders ---------- */
function picTasks(l,n,flash,focus){
  const lv=LEVEL[P.levels[l]];
  let pool=WORDS.filter(x=>x[l].length>=lv.min&&x[l].length<=lv.len);
  if(pool.length<n) pool=WORDS.slice().sort((a,b)=>a[l].length-b[l].length).slice(0,n*2);
  let items=[];
  if(focus&&focus.length){ // half of the words carry the look-alike letters that caused mistakes
    const letters=focus.map(id=>TWINS.find(x=>x.id===id)[l]).filter(Boolean);
    const pref=shuffle(pool.filter(x=>letters.some(c=>x[l].toLowerCase().includes(c))));
    items=pref.slice(0,Math.ceil(n/2));
  }
  shuffle(pool).forEach(x=>{ if(items.length<n&&!items.includes(x)) items.push(x); });
  return items.sort((a,b)=>a[l].length-b[l].length).map(item=>({t:'pic',l,item,opts:lv.opts,traps:lv.traps,flash}));
}
function whichTasks(langs,n){
  const lv=LEVEL[Math.min(...langs.map(l=>P.levels[l]))], per=Math.ceil(n/langs.length)+1, items=[];
  langs.forEach(l=>{ let ws=WHICH[l].filter(w=>w.length>=Math.min(lv.min,5)&&w.length<=lv.len); if(ws.length<per) ws=WHICH[l];
    shuffle(ws).slice(0,per).forEach(w=>items.push({t:'which',w,l,langs})); });
  return shuffle(items).slice(0,n);
}
/* letters track */
const ORDER = l => [...ANCH.order[l]];
const learned = l => { const o=ORDER(l); return o.slice(0,Math.max(P.abc[l],6)); };
const nextLetters = l => { const o=ORDER(l), i=P.abc[l]; return i<o.length?o.slice(i,i+3):shuffle(o).slice(0,3); };
const firstCh = w => w.replace(/^[^\p{L}]+/u,'')[0].toUpperCase();
function letterOpts(l,ch){
  // the right letter, one more from the same alphabet, one that only exists in another alphabet
  const own=shuffle(learned(l).concat(ORDER(l).slice(0,12)).filter(c=>c!==ch))[0];
  const foreign=shuffle(['en','ru','ua'].filter(x=>x!==l).flatMap(x=>[...ABC[x]]).filter(c=>!ABC[l].includes(c)&&!HOMO.has(c)))[0];
  return shuffle([ch,own,foreign]);
}
function learnTasks(l,letters){
  const known=learned(l).filter(c=>!letters.includes(c)), out=letters.map(ch=>({t:'card',l,ch}));
  const quiz=shuffle(letters.concat(letters,shuffle(known).slice(0,2)));
  return out.concat(quiz.map(ch=>({t:'find',l,ch})));
}
function soundTasks(l,n){
  const set=learned(l), pool=WORDS.filter(x=>/^\p{L}/u.test(x[l])&&!/[ -]/.test(x[l]));
  const good=shuffle(pool.filter(x=>set.includes(firstCh(x[l]))));
  return good.concat(shuffle(pool)).filter((x,i,a)=>a.indexOf(x)===i).slice(0,n).map(item=>({t:'sound',l,item}));
}
function buildTasks(l,n){
  const set=learned(l), max=P.levels[l]===0?4:5;
  const pool=WORDS.filter(x=>x[l].length<=max&&!/[ -]/.test(x[l]));
  const good=shuffle(pool.filter(x=>[...x[l].toUpperCase()].every(c=>c==="'"||set.includes(c))));
  return good.concat(shuffle(pool).sort((a,b)=>a[l].length-b[l].length)).filter((x,i,a)=>a.indexOf(x)===i).slice(0,n)
    .sort((a,b)=>a[l].length-b[l].length).map(item=>({t:'build',l,item}));
}
/* blending: letter runs to letter (МА), hear-and-find syllables, words read by syllables */
const allSyl = l => [...SYLC].flatMap(c=>[...SYLV[l]].map(v=>c+v)).filter(x=>isSyl(l,x));
function sylSplit(l,w){ const u=w.toUpperCase(); if(u.length%2) return null; const out=[];
  for(let i=0;i<u.length;i+=2){ const x=u.slice(i,i+2); if(!isSyl(l,x)) return null; out.push(x); } return out; }
const VOW = /[АОУЫИІЕЁЮЯЄЇAEIOU]/i;
const EN_CVC = [...new Set(WORDS.map(x=>x.en).concat(WHICH.en))].filter(w=>/^[a-z]{3}$/.test(w)&&!VOW.test(w[0])&&VOW.test(w[1])&&!VOW.test(w[2])&&w[2]!=='y');
function blendTasks(l){
  const out=[];
  if(l==='en'){
    const ws=shuffle(EN_CVC);
    ws.slice(0,3).forEach(w=>out.push({t:'slide',l,parts:[...w],key:'w:'+w}));
    ws.slice(3,9).forEach(w=>{ const near=shuffle(EN_CVC.filter(x=>x!==w&&(x[0]===w[0]||x[1]===w[1]||x[2]===w[2]))).slice(0,2);
      out.push({t:'syl',l,key:'w:'+w,ans:w,opts:shuffle([w,...near])}); });
    return out;
  }
  const all=allSyl(l), set=learned(l);
  let pool=P.levels[l]===0?all.filter(x=>set.includes(x[0])&&set.includes(x[1])):all; if(pool.length<6) pool=all.filter(x=>'МСЛНАОУ'.includes(x[0]));
  pool=shuffle(pool);
  pool.slice(0,3).forEach(x=>out.push({t:'slide',l,parts:[...x],key:'s:'+x}));
  pool.slice(3,8).forEach(x=>{ const sameC=shuffle(all.filter(y=>y[0]===x[0]&&y!==x))[0], sameV=shuffle(all.filter(y=>y[1]===x[1]&&y!==x))[0];
    out.push({t:'syl',l,key:'s:'+x,ans:x,opts:shuffle([x,sameC,sameV])}); });
  shuffle(WORDS.map(item=>({item,sy:sylSplit(l,item[l])})).filter(x=>x.sy&&x.sy.length>=2)).slice(0,3)
    .forEach(x=>out.push({t:'sw',l,item:x.item,sy:x.sy}));
  return out;
}
function buildTest(){
  const tasks=[{t:'intro',kind:'start'}];
  P.langs.forEach(l=>{
    tasks.push({t:'intro',l});
    shuffle(ORDER(l).slice(0,12)).slice(0,5).forEach(ch=>tasks.push({t:'find',l,ch,test:true}));
    if(P.abcKnow===0) return;
    const used=new Set();
    [[1,3],[4,4],[5,5],[6,6],[7,8],[9,99]].forEach(([a,b])=>{
      let c=WORDS.filter(x=>!used.has(x)&&x[l].length>=a&&x[l].length<=b); if(!c.length) c=WORDS.filter(x=>!used.has(x));
      const it=rnd(c); used.add(it); tasks.push({t:'pic',l,item:it,opts:3,traps:1,test:true});
    });
    shuffle(WORDS.filter(x=>!used.has(x)&&x[l].length>=4&&x[l].length<=6)).slice(0,4)
      .forEach(it=>tasks.push({t:'pic',l,item:it,opts:3,traps:1,flash:true,test:true}));

  if(P.langs.length>1&&P.abcKnow>0){ tasks.push({t:'intro',which:true}); whichTasks(P.langs,6).forEach(x=>tasks.push(x)); }

}

const norm = s => s.toLowerCase().replace(/[aceopxyik]/g,c=>({a:'а',c:'с',e:'е',o:'о',p:'р',x:'х',y:'у',i:'і',k:'к'})[c]);
function dist(a,b){const m=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function optionsFor(item,l,n,nTraps){
  const w=norm(item[l]), near=Math.max(1,Math.floor(w.length/4));
  // traps: a picture whose word in any language looks like this one; then words starting with the same letters
  let traps=shuffle(WORDS.filter(x=>x!==item&&['en','ru','ua'].some(k=>dist(norm(x[k]),w)<=near)));
  traps=traps.concat(shuffle(WORDS.filter(x=>x!==item&&!traps.includes(x)&&x[l].slice(0,2)===item[l].slice(0,2))));
  const picked=traps.slice(0,nTraps);
  for(const x of shuffle(WORDS)){ if(picked.length>=n-1)break; if(x!==item&&!picked.includes(x)) picked.push(x); }
  return shuffle([item,...picked]);
}

  $('t-find').textContent=t('find');

  $('sTarget').textContent=lc(letters[0]); $('sTimer').textContent='0.0';

    const b=e.target.closest('.cell'); if(!b||b.classList.contains('done'))return;

function logHist(kind,l,acc,ms){

function computeTest(log){
  const res={d:today(),langs:{},confuse:{},twins:{}};
  P.langs.forEach(l=>{
    const rd=log.filter(r=>r.kind==='read'&&r.l===l), fl=log.filter(r=>r.kind==='flash'&&r.l===l), ok=rd.filter(r=>r.ok);
    const acc=rd.length?ok.length/rd.length:0, maxLen=Math.max(0,...ok.map(r=>r.word.length));
    const avg=ok.length?ok.reduce((s,r)=>s+r.ms,0)/ok.length:99999;
    const flOk=fl.filter(r=>r.ok), flashMs=flOk.length?Math.min(...flOk.map(r=>r.shown)):null;
    const fd=log.filter(r=>r.kind==='find'&&r.l===l), la=fd.length?fd.filter(r=>r.ok).length/fd.length:0;
    let lv=1;

    if(acc>=.67&&maxLen>=6&&avg<4000&&flashMs&&flashMs<=1100) lv=3;
    if(acc>=.83&&maxLen>=7&&flashMs&&flashMs<=550) lv=4;
    res.langs[l]={acc:Math.round(acc*100),la:Math.round(la*100),read:rd.length>0,maxLen,flashMs,lv};

    const seen={}, bad={};

      if(tw[l]&&r.word.toLowerCase().includes(tw[l])){ seen[tw.id]=(seen[tw.id]||0)+1; if(!r.ok) bad[tw.id]=(bad[tw.id]||0)+1; } }));
    res.twins[l]={};
    Object.keys(bad).filter(id=>bad[id]>=2&&bad[id]/seen[id]>=.5).sort((a,b)=>bad[b]/seen[b]-bad[a]/seen[a]).slice(0,2)
      .forEach(id=>res.twins[l][id]=bad[id]);

  log.filter(r=>r.kind==='which'&&!r.ok&&r.chose).forEach(r=>{ const k=r.l+'>'+r.chose; res.confuse[k]=(res.confuse[k]||0)+1; });
  return res;
}
const focusFor = l => { const r=lastTest(); if(!r||!r.twins[l])return [];
  return Object.entries(r.twins[l]).sort((a,b)=>b[1]-a[1]).slice(0,2).map(e=>e[0]); };
const confusedLangs = () => { const r=lastTest(); if(!r)return [];
  const s=new Set(); Object.keys(r.confuse).forEach(k=>k.split('>').forEach(l=>s.add(l))); return P.langs.filter(l=>s.has(l)); };

/* ---------- the personal plan ---------- */
function needOf(l){ const r=lastTest(); let n=5-P.levels[l]; if(l!==P.school)n+=1; if(r&&r.langs[l]&&r.langs[l].acc<70)n+=1; return Math.max(1,n); }
function buildPlan(keepBefore){
  const old=P.plan, steps=[], k=[2,3,4][P.minutes], ls=P.langs, need={}, credit={};
  ls.forEach(l=>{need[l]=needOf(l);credit[l]=0});
  const tot=ls.reduce((s,l)=>s+need[l],0), conf=confusedLangs();
  for(let s=0;s<STEPS;s++){
    // the language that needs more help gets more sessions (smooth weighted round-robin)
    ls.forEach(l=>credit[l]+=need[l]); const p=ls.slice().sort((a,b)=>credit[b]-credit[a])[0]; credit[p]-=tot;
    if(old&&keepBefore&&s<keepBefore&&old.steps[s]){ steps.push(old.steps[s]); continue; }
    if(TEST_STEPS.includes(s)){ steps.push({test:true,missions:[{type:'test'}],done:[false]}); continue; }
    const others=ls.filter(x=>x!==p).sort((a,b)=>need[b]-need[a]), q=others.length?others[s%others.length]:null, lp=P.levels[p];
    const readM = l => P.levels[l]===0?{type:'sound',l}:{type:'read',l,focus:focusFor(l)};
    const readers=ls.filter(l=>P.levels[l]>0);
    if(lp===0){ // learning letters: new letters, first sound, building words, letter table
      const c0=[{type:'learn',l:p},P.abc[p]>=9?{type:'blend',l:p}:{type:'sound',l:p},{type:'sound',l:p},P.abc[p]>=6?{type:'build',l:p}:{type:'letters',l:p},{type:'letters',l:p}];
      if(q) c0.push(readM(q));

      steps.push({missions:m0,done:m0.map(()=>false)}); continue;
    }
    const cand=[{type:'read',l:p,focus:focusFor(p)}];
    if(lp===1) cand.push({type:'blend',l:p}); // still reading letter by letter: practise blending
    cand.push(lp>=2||P.goal===1?{type:'flash',l:p}:{type:'letters',l:p});
    if(readers.length>1&&(P.goal===2||conf.length>1||s%2===0)) cand.push({type:'which',langs:conf.filter(l=>P.levels[l]>0).length>1?conf.filter(l=>P.levels[l]>0):readers});

    if(q) cand.push(readM(q));
    const ms=[]; cand.forEach(c=>{ if(ms.length<k&&!ms.some(m=>m.type===c.type&&m.l===c.l)) ms.push(c); });
    ms.sort((a,b)=>(b.type==='letters')-(a.type==='letters')); // warm-up first

}
function stepState(i){

function stepFinished(si){

function completeMission(ctx,acc,l){

  more+=conf.length?`<div class="row">${conf.map(([k,n])=>{const [a,b]=k.split('>');return `<span class="pill">${fmt(t('confPair'),{a:LANG[a].name,b:LANG[b].name,n})}</span>`}).join('')}</div>`:`<p class="note">${t('noConfuse')}</p>`;
  const tw=[]; Object.entries(res.twins).forEach(([l,o])=>Object.entries(o).forEach(([id,n])=>tw.push(`<span class="pill">${LANG[l].name}: ${TWINS.find(x=>x.id===id).show} ×${n}</span>`)));
  more+=`<span class="lbl">${t('twins')}</span>`+(tw.length?`<div class="row">${tw.join('')}</div>`:`<p class="note">${t('noTwins')}</p>`);
  $('repMore').innerHTML=more;
}

/* ---------- grown-ups ---------- */
let delAsk=false;
function renderParent(){
  go('parent'); chrome();
  $('paTitle').textContent=t('paTitle'); $('pa-kids').textContent=t('kids'); $('pa-hist').textContent=t('hist');
  $('pa-how').textContent=t('how'); $('pa-howText').textContent=t('howText');
  const kids=PROFILES.map(p=>({p,html:esc(p.name)})).concat([{add:true,html:t('addKid')}]);
  chipRow($('kidList'),kids,it=>it.p===P,it=>{ if(it.add){ renderWelcome(); return; } P=it.p; save(); delAsk=false; renderParent(); });
  const box=$('paSettings');
  box.innerHTML=`<span class="lbl">${t('langs')}</span><div class="row" id="paLangs"></div>
    <span class="lbl">${t('qSchool')}</span><div class="row" id="paSchool"></div>
    <span class="lbl">${t('levels')}</span><div id="paLevels" style="display:flex;flex-direction:column;gap:8px"></div>
    <span class="lbl">${t('minL')}</span><div class="row" id="paMin"></div>
    <span class="lbl">${t('goalL')}</span><div class="row" id="paGoal"></div>
    <div class="row"><button class="chip plain" id="paCaps" aria-pressed="${P.caps}">${P.caps?'✓ ':''}${t('caps')}</button><button class="chip plain" id="paSound" aria-pressed="${S.sound}">${S.sound?'🔊':'🔇'} ${t('sound')}</button></div>
    <p class="note" id="voiceNote" hidden></p>
    <div class="btns"><button class="btn small" id="paRetest">${t('retest')}</button>${P.tests.length?`<button class="btn small ghost" id="paRebuild">${t('rebuild')}</button><button class="btn small ghost" id="paRep">${t('showRep')}</button>`:''}</div>`;
  const changed=()=>{ if(P.plan) buildPlan(curStep()); save(); renderParent(); };
  chipRow($('paLangs'),['en','ru','ua'].map(langChip),it=>P.langs.includes(it.l),it=>{
    P.langs=P.langs.includes(it.l)?(P.langs.length>1?P.langs.filter(x=>x!==it.l):P.langs):['en','ru','ua'].filter(x=>x===it.l||P.langs.includes(x));
    if(!P.langs.includes(P.school))P.school=P.langs[0]; changed(); },it=>it.l);
  chipRow($('paSchool'),P.langs.map(langChip),it=>P.school===it.l,it=>{P.school=it.l;changed()},it=>it.l);
  $('paLevels').innerHTML=P.langs.map(l=>`<div class="lvrow"><span class="name">${heroImg(l)}${LANG[l].name}</span>
    <button class="step" data-l="${l}" data-d="-1" ${P.levels[l]<=0?'disabled':''} aria-label="−">−</button><span class="val">${t('lv')[P.levels[l]]}</span>
    <button class="step" data-l="${l}" data-d="1" ${P.levels[l]>=4?'disabled':''} aria-label="+">+</button></div>`).join('');
  $('paLevels').onclick=e=>{const b=e.target.closest('[data-d]'); if(!b)return; P.levels[b.dataset.l]+= +b.dataset.d; changed(); };
  chipRow($('paMin'),t('mins'),(_,i)=>P.minutes===i,(_,i)=>{P.minutes=i;changed()});
  chipRow($('paGoal'),t('goals'),(_,i)=>P.goal===i,(_,i)=>{P.goal=i;changed()});
  $('paCaps').onclick=()=>{P.caps=!P.caps;save();renderParent()};
  $('paSound').onclick=()=>{S.sound=!S.sound;store.set('sound',S.sound);renderParent()};
  $('paRetest').onclick=startTest;
  if($('paRebuild')) $('paRebuild').onclick=()=>{ buildPlan(curStep()); toast(t('rebuilt')); renderParent(); };
  if($('paRep')) $('paRep').onclick=()=>renderReport(lastTest(),P.tests.length>1?P.tests[P.tests.length-2]:null);
  // voice availability
  const vn=$('voiceNote'), miss=voices.length?P.langs.filter(l=>!voiceFor(l)).map(l=>LANG[l].name):[];
  vn.hidden=!S.sound||!miss.length; vn.textContent=miss.length?fmt(t('noVoice'),{x:miss.join(', ')}):'';
  // pilot: letters that turn into things vs plain cards
  const pb=$('paPilot');
  if(P.langs.includes('ru')){
    const r=P.pilot&&P.pilot.result;
    pb.innerHTML=`<span class="lbl">${t('pilotT')}</span><p class="note">${t('pilotText')}</p>
      <div class="btns"><button class="btn small" id="pil1">${t('pilot1')}</button><button class="btn small ghost" id="pil2" ${P.pilot&&P.pilot.shown?'':'disabled'}>${t('pilot2')}</button></div>
      ${P.pilot&&P.pilot.shown?`<p class="note">${fmt(t('pilotWhen'),{d:P.pilot.shown})}</p>`:''}
      ${r?`<div class="kv"><span>${t('pilotM')}</span><b>${r.morph} / ${r.n}</b></div><div class="kv"><span>${t('pilotC')}</span><b>${r.control} / ${r.n}</b></div><p class="note">${t(r.morph>r.control?'pilotWin':r.morph<r.control?'pilotLose':'pilotTie')}</p>`:''}`;
    pb.hidden=false;
    $('pil1').onclick=()=>run(shuffle(Object.keys(MORPH.ru).concat(PILOT_CONTROL)).map(ch=>({t:'card',l:'ru',ch})),{kind:'pilotShow',l:'ru'});
    $('pil2').onclick=()=>run(shuffle(Object.keys(MORPH.ru).concat(PILOT_CONTROL)).map(ch=>({t:'find',l:'ru',ch})),{kind:'pilot',l:'ru',type:'find'});
  } else pb.hidden=true;
  // history
  $('histList').innerHTML=P.hist.length?P.hist.slice(0,10).map(h=>`<div><span>${h.d} · ${t('mt')[h.kind]||h.kind}${h.l?' · '+LANG[h.l].name:''}</span><span>${h.acc}%${h.ms?' · '+h.ms+' '+t('ms'):''}</span></div>`).join(''):`<p class="note">${t('noHist')}</p>`;
  // delete
  $('paDanger').innerHTML=delAsk?`<p class="note">${fmt(t('delSure'),{n:esc(P.name)})}</p><div class="btns"><button class="btn small danger" id="delYes">${t('delYes')}</button><button class="btn small ghost" id="delNo">${t('cancel')}</button></div>`
    :`<div class="btns"><button class="btn small ghost" id="delAsk">${t('del')}</button></div>`;
  if($('delAsk')) $('delAsk').onclick=()=>{delAsk=true;renderParent()};
  if($('delNo')) $('delNo').onclick=()=>{delAsk=false;renderParent()};
  if($('delYes')) $('delYes').onclick=()=>{ PROFILES=PROFILES.filter(p=>p!==P); P=PROFILES[0]||null; delAsk=false; save(); P?renderParent():renderWelcome(); };
}

/* ---------- start ---------- */
// first touch unlocks audio and starts decoding the heroes' voices
addEventListener('pointerdown',()=>{ if(ac()) (P?P.langs:['en','ru','ua']).forEach(sprite); },{once:true});
chrome();
if(P) renderHome(); else renderWelcome();
})();
</script>
